services:
  vllm-serving:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sllm-vllm-serving
    network_mode: host
    environment:
      VS_HOST: "0.0.0.0"
      VS_PORT: "17810"
      VS_S3_ENDPOINT_URL: ""
      VS_S3_ACCESS_KEY: ""
      VS_S3_SECRET_KEY: ""
      VS_S3_BUCKET: "sllm-models"
      VS_S3_REGION: "us-east-1"
      VS_VLLM_HOST: "0.0.0.0"
      VS_VLLM_PORT: "8000"
      VS_VLLM_GPU_MEMORY_UTILIZATION: "0.85"
      VS_VLLM_MAX_MODEL_LEN: "16384"
      VS_VLLM_MAX_LORA_RANK: "32"
      VS_VLLM_SWAP_SPACE: "4"
      VS_VLLM_MAX_NUM_SEQS: "16"
      VS_VLLM_STARTUP_TIMEOUT: "300"
      VS_LOG_LEVEL: "INFO"
    volumes:
      - vllm-models:/app/vllm_serving/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  vllm-models:
    driver: local
