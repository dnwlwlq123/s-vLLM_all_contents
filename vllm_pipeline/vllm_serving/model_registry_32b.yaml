# 32B FP8 바닐라 서빙용 registry
# 14B 대비 응답 퀄리티 비교를 위한 설정 — adapter 없이 base 모델만 서빙
#
# 사용법:
#   VS_REGISTRY_PATH=model_registry_32b.yaml python run.py

base_model:
  name: "base_32b_fp8"
  s3_path: "models/base_32b_fp8/"
  local_path: "base_32b_fp8"

